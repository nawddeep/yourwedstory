      <div class="photo-grid photo-grid-three">
      <figure><img class="photo photo-bansri" src="../images/bansri.jpg" width="800" height="600" alt="A couple beneath a white scalloped arch" fetchpriority="high" decoding="async"></figure>

      <figure><img class="photo photo-celebration" src="../images/aditi-celebration.jpg" width="1100" height="734" alt="Guests dance in a sunlit courtyard" loading="lazy" decoding="async"></figure>
      <figure><img class="photo photo-portrait" src="../images/aditi-portrait.jpg" width="1100" height="734" alt="Aditi and Xavier smile together among their guests" loading="lazy" decoding="async"></figure>
      </div>
    </section>
